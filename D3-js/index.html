<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A2: d3 chart</title>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

    <div id="graph"></div>

    <script type="module">
      const margin = { top: 10, right: 30, bottom: 30, left: 60 },
        width = 460 - margin.left - margin.right,
        height = 400 - margin.top - margin.bottom;

      const svg = d3
        .select("#graph")
        .append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

      const x = d3.scaleLinear().domain([170, 235]).range([0, width]);
      svg
        .append("g")
        .attr("transform", "translate(0," + height + ")")
        .call(d3.axisBottom(x));
      const y = d3.scaleLinear().domain([2500, 8000]).range([height, 0]);
      svg.append("g").call(d3.axisLeft(y));

      const data = await d3.csv("../penglings.csv", (d) => ({
        flipper_length_mm: +d.flipper_length_mm,
        body_mass_g: +d.body_mass_g,
        species: d.species,
        bill_length_mm: +d.bill_length_mm,
      }));

      const clean = data.filter(
        (d) =>
          Number.isFinite(d.flipper_length_mm) &&
          Number.isFinite(d.body_mass_g) &&
          Number.isFinite(d.bill_length_mm),
      );

      const color = d3
        .scaleOrdinal()
        .domain(["Adelie", "Chinstrap", "Gentoo"])
        .range(["#ff8c00", "#a52bd4", "#008b8b"]);

      const size = d3
        .scaleSqrt()
        .domain(d3.extent(data, (d) => d.bill_length_mm))
        .range([3, 12]);

      svg
        .append("g")
        .selectAll("circle")
        .data(clean)
        .enter()
        .append("circle")
        .attr("cx", (d) => x(d.flipper_length_mm))
        .attr("cy", (d) => y(d.body_mass_g))
        .attr("r", (d) => size(d.bill_length_mm))
        .style("fill", (d) => color(d.species))
        .style("opacity", 0.8);
    </script>
  </body>
</html>
